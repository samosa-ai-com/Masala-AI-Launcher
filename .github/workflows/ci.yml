name: CI

# ./gradlew check on every push and PR (plan 0.3): :core and build-logic tests, the manifest check,
# the :pro import check and lint. The Play readiness report is shown in the job summary.

on:
  push:
    branches: [main]
  pull_request:
    # A docs-only change can't break the build, and every run costs minutes.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "HANDOFF.md"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Our self-hosted runner: no Actions minutes. It takes one job at a time. The repo is public, so
    # PRs from forks run on a GitHub-hosted runner instead: outside code never runs on our machine.
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || fromJSON('["self-hosted", "chanakya"]') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Self-hosted only: the checkout has no local.properties (gitignored),
      # so Gradle needs ANDROID_HOME. GitHub-hosted images set it already.
      - name: Point at BeyondMax Android SDK
        if: runner.environment != 'github-hosted'
        run: |
          echo "ANDROID_HOME=/home/rishabh/Android/Sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/home/rishabh/Android/Sdk" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Only what a PR can break, in the variants we ship: unit tests, lint on debug (release and
      # androidTest lint duplicate it), and the manifest/import guards. `check` also ran the release
      # unit tests and every lint variant, which doubled the bill for the same signal.
      - name: Check
        run: >
          ./gradlew --parallel --console=plain
          :core:test
          :app:testDebugUnitTest
          :app:lintDebug
          :app:checkDebugManifestPolicy
          :app:checkProfileManifestPolicy
          :app:checkProImports
          :app:checkListCalls

      # The readiness report goes in the job summary rather than an artifact, so reading it needs no
      # artifact storage.
      - name: Play readiness report
        if: always()
        run: cat build/reports/play-readiness-release.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: Upload reports
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: reports
          retention-days: 7
          path: |
            build/reports/play-readiness-*.md
            app/build/reports/lint-results-*.html
            */build/reports/tests/
          if-no-files-found: ignore
